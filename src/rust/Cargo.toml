[package]
name = 'rpkgkit'
publish = false
version = '0.2.0'
edition = '2021'
rust-version = '1.65'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'rpkgkit'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
regex = "1.13.1"

[profile.release]
lto = true
codegen-units = 1
