name: Sync Main to Test Branch

on:
  workflow_run:
    workflows: ["R-CMD-check.yaml"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sync-test-branch-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  sync-test:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
      github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout checked commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync main to test
        id: sync
        uses: ./.github/actions/sync-test-branch
        with:
          branch: test

      - name: Log result
        run: |
          if [[ "${{ steps.sync.outputs.synced }}" == "true" ]]; then
            echo "✅ Test branch synced from main."
          else
            echo "⏭️  Test branch has unmerged work — skipped."
          fi
